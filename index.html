<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4e7cc" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%239b2928'/%3E%3Ccircle cx='15' cy='14' r='13' fill='%23d94136'/%3E%3Cellipse cx='11' cy='9' rx='4' ry='2.5' fill='%23ffe8ce'/%3E%3C/svg%3E" />
    <title>Tumbleworks</title>
    <script>if (location.pathname.endsWith('/demo.html')) document.documentElement.dataset.demoMenu = '';</script>
    <script defer src="./village-shell.js"></script>
    <link rel="stylesheet" href="/src/fonts.css">
    <style>
      :root { --ink: #2f3358; --cream: #fff9ee; --accent: #f25f33; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #234549; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 500; color: var(--ink); }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      body[data-screen='game'] #scene, #level-name { touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #hud button { pointer-events: auto; font: inherit; color: inherit; border: 0; cursor: pointer; }
      [hidden] { display: none !important; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

      /* One slim row at the top: the level pill opens the picker, the counter, and sound. */
      #top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; }
      .pill { height: 36px; padding: 0 14px; border-radius: 18px; background: rgb(255 249 238 / 0.92); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 3px 8px rgb(0 0 0 / 0.3); white-space: nowrap; }
      #levels-toggle::before { content: '≡'; font-size: 18px; line-height: 1; }
      #levels-toggle { min-width: 0; flex: 0 1 auto; }
      #level-name { overflow: hidden; text-overflow: ellipsis; }
      #load { margin-left: auto; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
      #load.jammed { color: #fff; background: #d8431d; }
      #mute { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; background: rgb(255 249 238 / 0.92); display: grid; place-items: center; padding: 0; box-shadow: 0 3px 8px rgb(0 0 0 / 0.3); }
      #mute svg { width: 20px; height: 20px; }
      #mute .off { display: none; }
      #mute.muted .on { display: none; }
      #mute.muted .off { display: block; }

      /* Short-lived text over the board. */
      #toasts { position: absolute; left: 10px; right: 10px; bottom: var(--toast-bottom, max(86px, calc(env(safe-area-inset-bottom) + 80px))); display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #instruction, #message { width: max-content; max-width: 100%; padding: 8px 14px; border-radius: 16px; background: rgb(255 249 238 / 0.94); font-size: 14px; line-height: 1.25; text-align: center; box-shadow: 0 4px 14px rgb(0 0 0 / 0.3); }
      #message.alarm { color: #c23a1a; }

      /* Five round actions along the bottom; the two fast forwards work while held. */
      #bottom { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 18px; }
      .action { width: 54px; height: 54px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; box-shadow: 0 4px 0 #c9b597, 0 7px 12px rgb(0 0 0 / 0.3); font-size: 24px; font-weight: 600; }
      .action:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9b597, 0 4px 8px rgb(0 0 0 / 0.3); }
      .action:disabled { opacity: 0.5; }
      .action svg { width: 26px; height: 26px; }
      #undo.attention { background: var(--accent); color: #fff !important; box-shadow: 0 4px 0 #a83c1b, 0 7px 12px rgb(0 0 0 / 0.3); animation: pulse 0.7s ease-in-out infinite; }
      @keyframes pulse { 50% { filter: brightness(1.18); } }


      #confetti { position: absolute; inset: 0; overflow: hidden; }
      #confetti i { position: absolute; top: -20px; width: 10px; height: 6px; border-radius: 2px; animation: fall linear forwards; }
      @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
      #focus-ring { position: fixed; width: 66px; height: 66px; border: 4px solid #fff8d4; outline: 3px solid var(--accent); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px #ffda67; pointer-events: none; animation: pulse .8s ease-in-out infinite; }
      #board-controls { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #board-controls:focus-within { width: auto; height: auto; clip-path: none; left: 12px; right: 12px; top: 60px; padding: 12px; border-radius: 12px; background: var(--cream); display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
      #board-controls button { border: 1px solid #c9b597; padding: 7px; border-radius: 6px; }
      #boot { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding: max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom)); background:#123a40; background:color-mix(in srgb,var(--village-land,#71958a) 29%,#102e35); }
      #boot .print { width:min(100%,440px); height:min(100%,760px); display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; background:#f4e7cc; padding:7px; border:1px solid #bba579; box-shadow:0 6px 24px #091e2966; }
      #boot h1 { font: bold clamp(43px,12vw,59px)/1 Fredoka,system-ui,sans-serif; text-align:center; letter-spacing:-.065em; margin:17px 0 19px; color:#203e42; }
      .boot-art { background:var(--village-print,linear-gradient(145deg,#75988a,#236771)) 10% center / cover; }
      .boot-panel { padding:24px 16px 19px; background:color-mix(in srgb,var(--village-land,#71958a) 21%,#102e35); color:#fff4db; text-align:center; }
      .boot-rail { width:90px; height:3px; position:relative; margin:10px auto 16px; border-radius:3px; background:var(--village-accent,#e4b875); }
      .boot-rail::before { content:''; position:absolute; left:0; bottom:3px; height:12px; width:12px; border-radius:50%; background:radial-gradient(circle at 32% 25%,#fffdf4 8%,#f4d084 29%,#b87839 80%); animation:roll-marble 1.6s ease-in-out infinite alternate; }
      @keyframes roll-marble { to { transform:translateX(78px); } }
      #boot-message { margin:0; font:500 15px/1.45 system-ui,sans-serif; }
      #boot[data-error] .boot-rail::before { animation:none; }
      #boot-retry { margin:12px 0 0; padding:8px 20px; min-height:44px; font:600 15px system-ui; border:0; border-radius:4px; background:#f6e5bc;color:#203e42; }
      body:has(#boot:not([hidden])) #hud,body:has(#boot:not([hidden])) .wv { visibility:hidden; }
      @media(prefers-reduced-motion:reduce) { .boot-rail::before { animation:none; transform:translateX(39px); } }
      @media (max-height: 600px) and (min-width: 600px) { .action { width: 44px; height: 44px; } #bottom { bottom: 8px; } #toasts { bottom: 62px; } }
      @media (max-width: 370px) { #bottom { gap: 8px; } .action { width: 50px; height: 50px; } }
      @media (max-width: 420px) { #top { gap: 5px; left: 8px; right: 8px; } .pill { font-size: 12px; padding: 0 9px; gap: 4px; } }
      @media (prefers-reduced-motion: reduce) { #confetti { display: none; } #focus-ring, #undo.attention { animation: none; } }
      /* The controls sit on the same dark enamel and amber buttons as the arcade machines. */
      #top .pill, #hud #mute { background: #293343; color: #f4f2ff; border: 1px solid #ae8a62; box-shadow: 0 3px 0 #18232e, 0 5px 14px #0005; }
      #load { color: #f0d3a1 !important; letter-spacing: .02em; }
      #load.full { color: #ffd98a !important; border-color: #b58a3c; }
      #load.jammed { color: #ffe1a3 !important; border-color: #ff9c54; }
      #instruction { background: #293343f2; color: #ecebff; border: 1px solid #887b6b; border-radius: 12px; }
      .action { background: #f6e8c9; box-shadow: 0 4px 0 #92734f, 0 7px 12px #0006; }
      .action:active { box-shadow: 0 1px 0 #92734f, 0 4px 8px #0006; }
      #hint { background: #a2c9be; box-shadow: 0 4px 0 #267c79, 0 7px 12px #0006; }
      .fast { background: #ecddc2; color: var(--ink); box-shadow: 0 4px 0 #847356, 0 7px 12px #0006; touch-action: none; font-size: 20px; font-weight: 700; }
      #faster { background: #ecddc2; }
      .fast.active, .fast:active { transform: translateY(3px); box-shadow: 0 1px 0 #847356, 0 4px 8px #0006; background: #fff; }
      .fast:disabled { opacity: 0.45; }
      /* Candy finish: a soft sheen on every round button, and a card that sits up off the board. */
      .action, #top .pill, #hud #mute { background-image: linear-gradient(rgb(255 255 255 / 0.4), rgb(255 255 255 / 0) 58%); }
      #top .pill, #hud #mute { background-image: linear-gradient(rgb(255 255 255 / 0.16), rgb(255 255 255 / 0) 58%); }
      #guide { padding: 2px 10px; background: #293343d9; border-radius: 12px; text-align: center; }
      #guide-text { margin: 0 0 5px; }
      #hud #guide-skip { color: #c5c1ff; background: none; font-size: 12px; text-decoration: underline; padding: 5px 10px; }
      #guide-pointer { position: fixed; width: 62px; height: 62px; border: 3px solid #f6e8c9; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px #10283e; pointer-events: none; }
      #guide-pointer svg { position: absolute; width: 42px; height: 48px; left: 35px; top: 34px; filter: drop-shadow(0 2px 2px #0009); transform-origin: 15px 7px; animation: guide-tap 1.6s ease-in-out infinite; }
      @keyframes guide-tap { 0%, 65%, 100% { transform: translate(3px, 7px) rotate(-18deg); } 30%, 40% { transform: translate(-3px, -4px) rotate(-26deg) scale(.94); } }
      @media (prefers-reduced-motion: reduce) { #guide-pointer svg { animation: none; } }
      /* Stamped ivory keys and petrol enamel instrument plates. */
      #top .pill, #hud #mute { border: 1px solid #b09565; box-shadow: inset 0 0 0 2px #234149, 0 2px 0 #16282d, 0 3px 7px #10222865; background: linear-gradient(#375861,#213b43); color: #fff1d7; }
      .action, #faster { color:#213c42; border:1px solid #705839; background:linear-gradient(160deg,#fff6dc 12%,#f4dfb7 72%,#ddbd8e); box-shadow:inset 0 0 0 2px #fff3d6,inset 0 0 0 3px #c7a979,0 3px 0 #745b3f,0 5px 7px #16353755; }
      #hint { background:linear-gradient(145deg,#c0dbca,#92b2a5);box-shadow:inset 0 0 0 2px #d6e4cf,inset 0 0 0 3px #87a196,0 3px 0 #45675f,0 5px 7px #16353755; }
      .action:active,.fast.active { transform:translateY(3px);box-shadow: inset 0 1px 3px #57472b66, 0 1px 0 #664e36; }
      #top .pill, #hud #mute { border-color:var(--village-accent,#b09565); }

    </style>
    <link rel="stylesheet" href="/src/view/shell.css">
  </head>
  <body>
    <main id="demo-home" aria-label="Tumbleworks">
      <header class="demo-hero"><h1>Tumbleworks</h1><span id="demo-island"></span></header>
      <nav data-demo-menu aria-label="Demos"><a id="all" href="./?demo=levels">All levels</a></nav>
    </main>
    <canvas id="scene" tabindex="0" aria-label="Puzzle board"></canvas>
    <div id="hud" inert>
      <div id="top">
        <button id="levels-toggle" class="pill" aria-expanded="false" aria-controls="levels"><span id="level-name"></span></button>
        <span id="load" class="pill"></span>
        <div id="guide" hidden><button id="guide-skip" aria-label="Skip guide"><span id="instruction" role="note"></span><span id="skip-label">Skip guide</span><span aria-hidden="true">×</span></button></div>
        <button id="mute" aria-label="Sound">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h4L13 5v14l-5-4.5H4z" fill="currentColor"/><path d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h4L13 5v14l-5-4.5H4z" fill="currentColor"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
        </button>
      </div>
      <div id="levels-backdrop" hidden></div>
      <section id="levels" role="dialog" aria-modal="true" aria-label="Levels" hidden>
        <header id="levels-head">
          <button id="map-open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg><span id="map-label">Back to village</span></button>
          <button id="menu-back" class="menu-icon" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
          <span id="menu-heading" hidden>Settings</span>
          <button id="menu-settings" class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.7 2.4-2 .9L5 5.6 2.8 9.4l1.7 1.7v1.8l-1.7 1.7L5 18.4l2.3-.7 2 .9.7 2.4h4l.7-2.4 2-.9 2.3.7 2.2-3.8-1.7-1.7v-1.8l1.7-1.7L19 5.6l-2.3.7-2-.9L14 3z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button id="menu-close" class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <div id="menu-main">
          <p id="menu-round"></p>
          <nav id="chips" aria-label="Round levels"></nav>
        </div>
        <div id="menu-secondary" hidden>
          <div id="language"><span id="language-label">Language</span><div><button id="language-en" lang="en">English</button><button id="language-fr" lang="fr">Français</button></div></div>
          <div id="patterns" aria-label="Container patterns"></div>
          <details id="level-help-details"><summary id="help-label">How to play</summary><div id="level-title"></div><p id="level-help"></p></details>
          <button id="guide-replay" hidden>Restart with guide</button>
          <button id="copy-replay">Copy this game for a bug report</button>
        </div>
      </section>
      <div id="focus-ring" hidden></div>
      <div id="guide-pointer" aria-hidden="true" hidden><span id="guide-pointer-label" class="sr">Tap here</span><svg viewBox="0 0 44 50" fill="none"><path d="M11 29V7C11 2 19 2 19 7V18C19 14 26 14 26 19V21C26 17 33 18 33 23V25C33 21 40 22 40 27V33C40 39 36 44 33 47H17L5 33C1 28 6 23 10 28L11 29Z" fill="#fff7db" stroke="#10283e" stroke-width="2.5" stroke-linejoin="round"/><path d="M19 18v10M26 21v8M33 25v6M17 43h18" stroke="#10283e" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div id="board-controls" aria-label="Board pieces"></div>
      <div id="toasts">
        <p id="guide-text" class="sr" role="status" aria-live="polite"></p>
        <div id="message" role="status" aria-live="polite" hidden></div>
        <div id="next" hidden><span id="next-label"></span><span id="next-boxes"></span></div>
      </div>
      <div id="bottom">
        <button id="restart" class="action" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v4h-4"/><path d="M19.5 9A8 8 0 1 0 20 14"/></svg></button>
        <button id="undo" class="action" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H5V3"/><path d="M5.5 7.5A8 8 0 1 1 4 13"/></svg></button>
        <button id="hint" class="action" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
        <button id="fast" class="action fast" aria-label="Fast forward ×3 (hold)" aria-pressed="false">×3</button>
        <button id="faster" class="action fast" aria-label="Fast forward ×5 (hold)" aria-pressed="false">×5</button>
      </div>
      <div id="card" role="region" aria-labelledby="card-title" aria-describedby="card-body" hidden>
        <h2 id="card-title"></h2>
        <p id="card-body"></p>
        <div id="stop-progress" aria-hidden="true" hidden></div>
        <button id="card-restart" hidden></button><button id="card-action"></button>
      </div>
      <div id="confetti"></div>
    </div>
    <div id="boot"><div class="print"><h1>Tumbleworks</h1><div class="boot-art" aria-hidden="true"></div>
      <div class="boot-panel"><div class="boot-rail" aria-hidden="true"></div><p id="boot-message" role="status" aria-live="polite">Setting up the workshop…</p><button id="boot-retry" type="button" hidden>Retry</button></div></div></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
