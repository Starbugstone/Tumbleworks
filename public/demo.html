<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233d43">
<title>Tumbleworks · Workshop</title>
<script defer src="./village-shell.js"></script>
<style>
* {box-sizing:border-box}
html {background:#eddfbf;color:#182f34;font-family:system-ui,sans-serif}
body {margin:0;min-height:100svh;display:grid;place-items:center;padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom))}
main {width:min(100%,410px);background:#f7edda;border:1px solid #766e55;box-shadow:3px 4px 0 #ae9b73;padding-bottom:9px}
header {position:relative;height:clamp(132px,29svh,214px);overflow:hidden;background:var(--village-print,linear-gradient(140deg,#689790,#276670)) center 47% / cover}
header::after {content:'';position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#0b3439e8)}
h1 {position:absolute;z-index:1;bottom:7px;left:12px;margin:0;color:#fff0ce;font: bold clamp(42px,12vw,58px)/1 Georgia,serif;letter-spacing:-.06em;text-shadow:0 2px #193a3b}
nav {display:grid;gap:0;padding:6px 10px 0}
a {display:flex;align-items:center;gap:13px;min-height:clamp(62px,11.4svh,80px);padding:6px 4px;color:#1e363a;text-decoration:none;border-bottom:1px solid #bcae90;font: bold 23px/1.1 Georgia,serif}
nav img {width:77px;height:clamp(49px,9svh,65px);border-radius:3px;object-fit:cover;background:#456b70}
a::after {content:'›' / '';margin-left:auto;width:29px;height:29px;border:1px solid #aa9473;border-radius:50%;display:grid;place-items:center;font:21px/1 Georgia}
a:active {background:#e1d1ad} a:focus-visible {outline:3px solid #99522f;outline-offset:-2px}
.all {border:0;min-height:48px;font:bold 16px system-ui;color:#39585a}
</style>
<main><header><h1>Tumbleworks</h1></header><nav data-demo-menu aria-label="Demos">
<a class="all" href="./?demo=levels" id="all">All levels</a>
</nav></main>

</html>
