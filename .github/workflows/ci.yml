# The o2switch controller deploys a commit on main once this workflow's push run
# succeeds, so every job here gates deployment. See docs/deployment.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Allow the game containers to write their bind mount
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      - name: Start the game
        run: docker compose up -d --build dev
      - name: Wait for the game to answer
        run: timeout 180 sh -c 'until curl -fsS -o /dev/null http://localhost:5180/; do sleep 2; done'
      - name: Check touch input and rendering guarantees
        run: docker compose --profile e2e run --rm e2e npx playwright test tests/e2e/input-regressions.spec.ts tests/e2e/render-hygiene.spec.ts --project game --workers=2
      - name: Show server diagnostics on failure
        if: failure()
        run: docker compose logs dev
      - name: Stop this job's game server
        if: always()
        run: docker compose down

  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Test the hosting controller
        run: |
          bash tests/o2switch/install-test.sh
          python3 tests/o2switch/setup-terminal-test.py
          php tests/o2switch/deploy-test.php
          php tests/o2switch/health-test.php
          php tests/o2switch/setup-test.php
      - name: Build like the host, serve with Apache, play in a browser
        run: bash tests/o2switch/site-test.sh
