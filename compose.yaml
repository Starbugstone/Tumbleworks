name: tumbleworks
services:
  dev:
    build: .
    # Deliberately not bound to 127.0.0.1: this is how a phone on the same Wi-Fi reaches the game.
    ports:
      - '${TUMBLEWORKS_PORT:-5180}:5180'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    restart: 'no'
    networks:
      default:
        # Browsers force HTTPS on the .dev domain, so the service name can't be used as a URL.
        aliases: [game-server]
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    user: '1000:1000'
    working_dir: /app
    environment:
      HOME: /tmp
      TUMBLEWORKS_URL: http://game-server:5180
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on: [dev]
    init: true
volumes:
  node_modules:
